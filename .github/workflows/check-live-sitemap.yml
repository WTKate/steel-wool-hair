name: Check live Steel Wool Hair sitemap
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-live-sitemap.yml'
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Wix sitemap, cache, canonicals and indexing
        shell: bash
        run: |
          set -uo pipefail
          for path in '/sitemap.xml' '/pages-sitemap.xml' '/pages-sitemap.xml?cb=20261106v2' '/_wix/pages.json' '/' '/hair-menu' '/privacy-policy'; do
            url="https://www.steelwoolhair.com.au${path}"
            echo "=== ${url} ==="
            curl -L -sS --max-time 30 -D /tmp/headers -o /tmp/response -w 'status=%{http_code} type=%{content_type} bytes=%{size_download}\n' "${url}" || true
            grep -Ei '^(cache-control|age|etag|x-wix|x-cache|last-modified|vary|content-type|location):' /tmp/headers | tail -12 || true
            if [[ "${path}" == *'sitemap'* ]] || [[ "${path}" == *'pages.json'* ]]; then
              head -c 2500 /tmp/response || true
              echo
            else
              grep -oiE '<(link[^>]+rel="canonical"[^>]*|meta[^>]+(name="robots"|wix-seo-tag)[^>]*|title[^>]*>[^<]*)' /tmp/response | head -15 || true
            fi
          done
          url='https://www.steelwoolhair.com.au/sitemap.xml'
          code=$(curl -LsS --max-time 30 -o /tmp/final-sitemap.xml -w '%{http_code}' "${url}") || exit 1
          test "${code}" = 200
          grep -Eq '<sitemapindex|<urlset' /tmp/final-sitemap.xml
          echo "PASS: sitemap index exists (separate child URL verification above)"
