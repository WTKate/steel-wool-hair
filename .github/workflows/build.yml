name: Build Wix Astro site
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node scripts/download-assets.mjs
      - run: npm run build
        env:
          WIX_CLIENT_ID: '90c0ea98-bdc3-4b2e-949f-0a2b7edf2985'
          WIX_SITE_ID: '3a1fe884-069e-4cfb-a76b-de7403733eed'
          WIX_CLIENT_INSTANCE_ID: '3a1fe884-069e-4cfb-a76b-de7403733eed'
      - name: Package Wix server build and source
        run: zip -qr steel-wool-wix-astro.zip . -x 'node_modules/*' '.git/*' '.env*' '.astro/*'
      - uses: actions/upload-artifact@v4
        with:
          name: steel-wool-wix-astro
          path: steel-wool-wix-astro.zip
          retention-days: 7
